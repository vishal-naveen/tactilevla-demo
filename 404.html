<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15181a">
<title>Not found - TactileVLA-Edge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315181a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f4c430' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
  /* Self-contained on purpose: a 404 is served from any depth, so no relative asset URLs. */
  :root { --wall-2:#15181a; --ivory:#ede4cf; --dim:#8d9391; --noodle:#f4c430; --held:#f08a24; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; background: var(--wall-2); color: var(--ivory);
         font-family: "Archivo", system-ui, sans-serif; }
  main { max-width: 34rem; }
  .code { font-weight: 800; font-stretch: 125%; font-size: clamp(4rem, 16vw, 8rem); line-height: .9; margin: 0 0 .25em; color: var(--held); }
  h1 { font-weight: 800; font-size: clamp(1.5rem, 4vw, 2.25rem); line-height: 1.1; margin: 0 0 .6em; }
  p { color: var(--dim); font-size: 1.0625rem; line-height: 1.55; margin: 0 0 1.6em; }
  a.btn { display: inline-block; padding: .8em 1.4em; border-radius: 999px; background: var(--noodle); color: var(--wall-2);
          font-weight: 700; text-decoration: none; }
  a.btn:hover, a.btn:focus-visible { outline: 2px solid var(--ivory); outline-offset: 3px; }
  a.quiet { margin-left: 1em; color: var(--ivory); }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>It never saw this page.</h1>
  <p>Nothing is published at this address. The demo is one page; everything lives on its front door.</p>
  <a class="btn" href="/tactilevla-demo/">Back to the demo</a>
  <a class="quiet" href="https://vishal-naveen.github.io/TactileVLA-Edge/">Project site</a>
</main>
</body>
</html>
